name: Feishu Photo Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

jobs:
  scan-images:
    runs-on: ubuntu-latest

    steps:
      - name: Scan all image blocks in Feishu document
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          APP_ID = os.environ["FEISHU_APP_ID"]
          APP_SECRET = os.environ["FEISHU_APP_SECRET"]
          NODE_TOKEN = "MNwRw7oGAifvY0kDkhzcgOTzngd"

          def get_json(url, token=None, method="GET", payload=None):
              headers = {}
              data = None
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json; charset=utf-8"
              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          auth = get_json(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              method="POST",
              payload={"app_id": APP_ID, "app_secret": APP_SECRET},
          )
          if auth.get("code") != 0:
              raise RuntimeError(
                  f"Authentication failed: {auth.get('code')} {auth.get('msg')}"
              )

          token = auth["tenant_access_token"]
          print("SUCCESS: Feishu authentication.")

          node_url = (
              "https://open.feishu.cn/open-apis/wiki/v2/spaces/get_node?"
              + urllib.parse.urlencode({"token": NODE_TOKEN})
          )
          node_result = get_json(node_url, token)
          if node_result.get("code") != 0:
              raise RuntimeError(
                  f"Wiki node error: {node_result.get('code')} "
                  f"{node_result.get('msg')}"
              )

          node = node_result.get("data", {}).get("node", {})
          doc_token = node.get("obj_token")
          if node.get("obj_type") != "docx" or not doc_token:
              raise RuntimeError("Could not resolve the Feishu document.")

          print("SUCCESS: Document identified.")

          all_images = []
          page_token = None
          page_number = 0

          while True:
              params = {"page_size": 500}
              if page_token:
                  params["page_token"] = page_token

              blocks_url = (
                  "https://open.feishu.cn/open-apis/docx/v1/documents/"
                  + urllib.parse.quote(doc_token, safe="")
                  + "/blocks?"
                  + urllib.parse.urlencode(params)
              )
              result = get_json(blocks_url, token)

              if result.get("code") != 0:
                  raise RuntimeError(
                      f"Blocks API error: {result.get('code')} "
                      f"{result.get('msg')}"
                  )

              data = result.get("data", {})
              blocks = data.get("items", [])
              page_number += 1

              for block in blocks:
                  if block.get("block_type") == 27:
                      image = block.get("image", {})
                      token_id = image.get("token")
                      if token_id:
                          all_images.append(token_id)

              print(
                  f"Scanned page {page_number}: "
                  f"{len(blocks)} blocks, "
                  f"{len(all_images)} image references found so far."
              )

              if not data.get("has_more"):
                  break

              page_token = data.get("page_token")
              if not page_token:
                  raise RuntimeError(
                      "API says more pages exist but returned no page token."
                  )

          unique_images = list(dict.fromkeys(all_images))

          print("SUCCESS: Finished scanning image blocks.")
          print("Total image blocks:", len(all_images))
          print("Unique image resources:", len(unique_images))
          print("Image resource IDs are available:", bool(unique_images))
          PY
