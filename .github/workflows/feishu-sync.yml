name: Feishu Photo Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

jobs:
  test-image-download:
    runs-on: ubuntu-latest

    steps:
      - name: Test downloading one Feishu image
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          APP_ID = os.environ["FEISHU_APP_ID"]
          APP_SECRET = os.environ["FEISHU_APP_SECRET"]
          NODE_TOKEN = "MNwRw7oGAifvY0kDkhzcgOTzngd"

          def request(url, token=None, method="GET", payload=None):
              headers = {}
              data = None
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json; charset=utf-8"
              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read(), response.headers

          raw, _ = request(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              method="POST",
              payload={"app_id": APP_ID, "app_secret": APP_SECRET},
          )
          auth = json.loads(raw.decode("utf-8"))
          if auth.get("code") != 0:
              raise RuntimeError(
                  f"Authentication failed: {auth.get('code')} {auth.get('msg')}"
              )

          token = auth["tenant_access_token"]
          print("SUCCESS: Feishu authentication.")

          node_url = (
              "https://open.feishu.cn/open-apis/wiki/v2/spaces/get_node?"
              + urllib.parse.urlencode({"token": NODE_TOKEN})
          )
          raw, _ = request(node_url, token)
          node_result = json.loads(raw.decode("utf-8"))
          if node_result.get("code") != 0:
              raise RuntimeError(
                  f"Wiki node error: {node_result.get('code')} "
                  f"{node_result.get('msg')}"
              )

          node = node_result.get("data", {}).get("node", {})
          doc_token = node.get("obj_token")
          if node.get("obj_type") != "docx" or not doc_token:
              raise RuntimeError("Could not resolve the document.")

          print("SUCCESS: Document identified.")

          page_token = None
          image_token = None

          while True:
              params = {"page_size": 500}
              if page_token:
                  params["page_token"] = page_token

              blocks_url = (
                  "https://open.feishu.cn/open-apis/docx/v1/documents/"
                  + urllib.parse.quote(doc_token, safe="")
                  + "/blocks?"
                  + urllib.parse.urlencode(params)
              )
              raw, _ = request(blocks_url, token)
              result = json.loads(raw.decode("utf-8"))

              if result.get("code") != 0:
                  raise RuntimeError(
                      f"Blocks API error: {result.get('code')} "
                      f"{result.get('msg')}"
                  )

              data = result.get("data", {})
              for block in data.get("items", []):
                  if block.get("block_type") == 27:
                      image_token = block.get("image", {}).get("token")
                      if image_token:
                          break

              if image_token:
                  break

              if not data.get("has_more"):
                  break

              page_token = data.get("page_token")
              if not page_token:
                  raise RuntimeError("Missing pagination token.")

          if not image_token:
              raise RuntimeError("No image resource token found.")

          print("SUCCESS: Found an image resource token.")
          print("Testing image resource download API.")

          download_url = (
              "https://open.feishu.cn/open-apis/drive/v1/medias/"
              + urllib.parse.quote(image_token, safe="")
              + "/download"
          )

          try:
              image_bytes, headers = request(download_url, token)
              content_type = headers.get("Content-Type", "")
              print("Download response content type:", content_type)
              print("Downloaded bytes:", len(image_bytes))

              if not image_bytes:
                  raise RuntimeError("The download response was empty.")

              if "json" in content_type.lower():
                  print("API returned JSON rather than image data.")
                  print(image_bytes[:1000].decode("utf-8", errors="replace"))
                  raise RuntimeError("Image download was not confirmed.")

              print("SUCCESS: Image download test completed.")
          except Exception as exc:
              print("Image download test failed:", str(exc))
              raise
          PY
