name: Feishu Photo Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  sync-photos:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync Feishu photos
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import hashlib
          import mimetypes
          import urllib.request
          import urllib.parse
          import urllib.error

          APP_ID = os.environ["FEISHU_APP_ID"]
          APP_SECRET = os.environ["FEISHU_APP_SECRET"]
          NODE_TOKEN = "MNwRw7oGAifvY0kDkhzcgOTzngd"

          IMAGE_DIR = "assets/feishu"
          PHOTOS_JS = "photos.js"

          def request(url, token=None, method="GET", payload=None):
              headers = {}
              data = None

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json; charset=utf-8"

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.read(), response.headers
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"HTTP {exc.code}: {detail[:1000]}"
                  ) from exc

          def get_json(url, token=None, method="GET", payload=None):
              raw, _ = request(url, token, method, payload)
              return json.loads(raw.decode("utf-8"))

          # 1. Authenticate
          auth = get_json(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              method="POST",
              payload={
                  "app_id": APP_ID,
                  "app_secret": APP_SECRET
              }
          )

          if auth.get("code") != 0:
              raise RuntimeError(
                  f"Authentication failed: {auth.get('code')} "
                  f"{auth.get('msg')}"
              )

          token = auth["tenant_access_token"]
          print("SUCCESS: Feishu authentication.")

          # 2. Resolve the Wiki node
          node_url = (
              "https://open.feishu.cn/open-apis/wiki/v2/spaces/get_node?"
              + urllib.parse.urlencode({"token": NODE_TOKEN})
          )

          node_result = get_json(node_url, token)

          if node_result.get("code") != 0:
              raise RuntimeError(
                  f"Wiki node error: {node_result.get('code')} "
                  f"{node_result.get('msg')}"
              )

          node = node_result.get("data", {}).get("node", {})
          doc_token = node.get("obj_token")

          if node.get("obj_type") != "docx" or not doc_token:
              raise RuntimeError("Could not resolve the document.")

          print("SUCCESS: Document identified.")

          # 3. Collect all image tokens from every page
          image_tokens = []
          seen_tokens = set()
          page_token = None

          while True:
              params = {"page_size": 500}

              if page_token:
                  params["page_token"] = page_token

              blocks_url = (
                  "https://open.feishu.cn/open-apis/docx/v1/documents/"
                  + urllib.parse.quote(doc_token, safe="")
                  + "/blocks?"
                  + urllib.parse.urlencode(params)
              )

              result = get_json(blocks_url, token)

              if result.get("code") != 0:
                  raise RuntimeError(
                      f"Blocks API error: {result.get('code')} "
                      f"{result.get('msg')}"
                  )

              data = result.get("data", {})

              for block in data.get("items", []):
                  if block.get("block_type") != 27:
                      continue

                  image_token = block.get("image", {}).get("token")

                  if image_token and image_token not in seen_tokens:
                      seen_tokens.add(image_token)
                      image_tokens.append(image_token)

              if not data.get("has_more"):
                  break

              page_token = data.get("page_token")

              if not page_token:
                  raise RuntimeError("Missing pagination token.")

          if not image_tokens:
              raise RuntimeError("No image resources found.")

          print(f"Found {len(image_tokens)} unique images.")

          # 4. Create the destination directory
          os.makedirs(IMAGE_DIR, exist_ok=True)

          expected_files = set()
          photo_entries = []

          # 5. Download each image into the website repository
          for index, image_token in enumerate(image_tokens, start=1):
              short_hash = hashlib.sha256(
                  image_token.encode("utf-8")
              ).hexdigest()[:20]

              download_url = (
                  "https://open.feishu.cn/open-apis/drive/v1/medias/"
                  + urllib.parse.quote(image_token, safe="")
                  + "/download"
              )

              # Download sequentially to avoid excessive API concurrency.
              time.sleep(0.3)

              image_bytes, headers = request(download_url, token)
              content_type = headers.get(
                  "Content-Type", ""
              ).split(";")[0].strip().lower()

              if not image_bytes:
                  raise RuntimeError(
                      f"Image {index} returned empty content."
                  )

              if "json" in content_type or image_bytes.startswith(b"{"):
                  raise RuntimeError(
                      f"Image {index} returned JSON instead of image data."
                  )

              extension = mimetypes.guess_extension(content_type) or ".jpg"

              # Normalize common image extensions.
              if extension == ".jpe":
                  extension = ".jpg"

              filename = f"photo_{short_hash}{extension}"
              filepath = os.path.join(IMAGE_DIR, filename)

              with open(filepath, "wb") as image_file:
                  image_file.write(image_bytes)

              expected_files.add(filename)

              photo_entries.append({
                  "src": f"{IMAGE_DIR}/{filename}",
                  "title": f"Photo {index}",
                  "location": "",
                  "alt": f"Photo {index}"
              })

              print(
                  f"Synced image {index}/{len(image_tokens)} "
                  f"({len(image_bytes)} bytes)"
              )

          # 6. Remove files for images no longer in the document
          for filename in os.listdir(IMAGE_DIR):
              filepath = os.path.join(IMAGE_DIR, filename)

              if os.path.isfile(filepath) and filename not in expected_files:
                  os.remove(filepath)

          # 7. Generate the photo list used by the existing website
          with open(PHOTOS_JS, "w", encoding="utf-8") as output:
              output.write(
                  "/* Automatically generated by Feishu Photo Sync. */\n"
              )
              output.write("window.PHOTOS = ")
              json.dump(
                  photo_entries,
                  output,
                  ensure_ascii=False,
                  indent=2
              )
              output.write(";\n")

          print(f"SUCCESS: Generated {len(photo_entries)} photo entries.")
          print("SUCCESS: Photo synchronization completed.")
          PY

      - name: Commit and push website updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add photos.js assets/feishu

          if git diff --cached --quiet; then
            echo "No photo changes detected."
          else
            git commit -m "Sync photos from Feishu"
            git push
            echo "Photo updates pushed to GitHub."
          fi
