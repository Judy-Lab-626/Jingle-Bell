name: Feishu Photo Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  test-feishu-api:
    runs-on: ubuntu-latest

    steps:
      - name: Test Feishu API access
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          app_id = os.environ["FEISHU_APP_ID"]
          app_secret = os.environ["FEISHU_APP_SECRET"]

          def post_json(url, payload, token=None):
              data = json.dumps(payload).encode("utf-8")
              headers = {"Content-Type": "application/json; charset=utf-8"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(
                  url, data=data, headers=headers, method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  print(f"HTTP error: {e.code}")
                  print(e.read().decode("utf-8")[:1000])
                  raise

          token_data = post_json(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              {"app_id": app_id, "app_secret": app_secret}
          )

          if token_data.get("code") != 0:
              raise RuntimeError(
                  "Could not obtain access token. "
                  f"Feishu code: {token_data.get('code')}; "
                  f"message: {token_data.get('msg')}"
              )

          token = token_data["tenant_access_token"]
          print("SUCCESS: Feishu access token obtained.")

          node_token = "MNwRw7oGAifvY0kDkhzcgOTzngd"
          url = (
              "https://open.feishu.cn/open-apis/wiki/v2/spaces/get_node"
              f"?token={node_token}"
          )

          req = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"},
              method="GET"
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"Wiki node API HTTP error: {e.code}")
              print(e.read().decode("utf-8")[:1000])
              raise

          if result.get("code") != 0:
              raise RuntimeError(
                  "Wiki node lookup failed. "
                  f"Feishu code: {result.get('code')}; "
                  f"message: {result.get('msg')}"
              )

          node = result.get("data", {}).get("node", {})
          print("SUCCESS: Wiki node information retrieved.")
          print("Object type:", node.get("obj_type", "unknown"))
          print("Document token available:", bool(node.get("obj_token")))
          PY
